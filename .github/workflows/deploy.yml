name: Deploy Edge Functions

on:
  push:
    branches: [main, dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve target project
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "ref=lgnvolndyftsbcjprmic" >> "$GITHUB_OUTPUT"
          else
            echo "ref=iqxzetwuxykplzdjysiu" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref ${{ steps.target.outputs.ref }}
