# Cron-invoked via x-agent-key, exactly like the two pollers above. Without
# this entry the function deploys with Supabase's default verify_jwt = true and
# the PLATFORM GATEWAY rejects the cron before any of our code runs — the job
# still reports "succeeded" in cron.job_run_details, because net.http_post is
# async and only records that the statement queued. That combination hid a
# dead poller for four hours: five green cron runs, every one a 401.
[functions.poll-smartlead-inbox]
verify_jwt = false

[functions.smartlead-webhook]
verify_jwt = false

[functions.setup-smartlead-webhook]
verify_jwt = false

[functions.sync-smartlead-campaigns]
verify_jwt = false

[functions.send-smartlead-email]
verify_jwt = false

